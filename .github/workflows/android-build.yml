name: android-build

# Reusable workflow invoked by ci.yml (and runnable on demand).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  apk:
    name: Android debug/release APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default 'tools' package was removed from the SDK
          # repository, which makes setup fail before any build runs.
          packages: platform-tools

      - name: Install SDK platform, NDK r27b and CMake
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Fetch vendored dependencies
        run: scripts/setup-deps.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (debug-signed until CI keys exist)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: armsx5-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: armsx5-android-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armsx5-test-reports
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: ignore
